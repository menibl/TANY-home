<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>HomeBot</title>
<style>
  :root {
    --bg: #05070f;
    --panel: #0c1120;
    --panel-border: #1c2540;
    --blue: #38bdf8;
    --purple: #a78bfa;
    --green: #4ade80;
    --yellow: #eab308;
    --text: #e5e9f5;
    --text-dim: #7d879e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(circle at 50% 30%, #0b1230 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--panel-border);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo {
    width: 40px; height: 40px; border-radius: 50%;
    background: radial-gradient(circle, var(--blue), #1e3a8a);
    box-shadow: 0 0 20px var(--blue);
  }
  .brand h1 { font-size: 18px; margin: 0; }
  .brand p { font-size: 12px; margin: 0; color: var(--text-dim); }
  nav a {
    color: var(--text-dim); text-decoration: none; margin-inline-start: 20px; font-size: 14px;
  }
  nav a:hover, nav a.active { color: var(--blue); }

  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; gap: 60px; flex-wrap: wrap; }

  .orb-zone { text-align: center; }
  .greeting { font-size: 26px; font-weight: 600; margin-bottom: 6px; }
  .subtext { color: var(--text-dim); margin-bottom: 30px; }

  .orb-wrap { position: relative; width: 280px; height: 280px; margin: 0 auto; }
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid rgba(56, 189, 248, 0.25);
    animation: pulse 3s ease-in-out infinite;
  }
  .ring:nth-child(2) { inset: -20px; animation-delay: .3s; }
  .ring:nth-child(3) { inset: -40px; animation-delay: .6s; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: .5; }
    50% { transform: scale(1.05); opacity: 1; }
  }
  .orb {
    position: absolute; inset: 30px; border-radius: 50%;
    cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #4fd1ff, #0b1c4d 70%);
    box-shadow: 0 0 60px var(--blue), inset 0 0 40px rgba(0,0,0,.4);
    transition: box-shadow .4s ease, background .4s ease;
  }
  .orb.state-clap, .orb.state-identifying, .orb.state-greeting {
    background: radial-gradient(circle at 35% 30%, #ffe066, #4d3d0b 70%);
    box-shadow: 0 0 60px var(--yellow), inset 0 0 40px rgba(0,0,0,.4);
  }
  .orb.state-thinking {
    background: radial-gradient(circle at 35% 30%, #c4b5fd, #2e1065 70%);
    box-shadow: 0 0 60px var(--purple), inset 0 0 40px rgba(0,0,0,.4);
  }
  .orb.state-session, .orb.state-heard, .orb.state-speaking, .orb.state-realtime {
    background: radial-gradient(circle at 35% 30%, #86efac, #0b3d1c 70%);
    box-shadow: 0 0 60px var(--green), inset 0 0 40px rgba(0,0,0,.4);
  }
  .orb.state-error {
    background: radial-gradient(circle at 35% 30%, #fca5a5, #4d0b0b 70%);
    box-shadow: 0 0 60px #f87171, inset 0 0 40px rgba(0,0,0,.4);
  }
  .orb:hover { filter: brightness(1.15); }
  .orb:active { filter: brightness(0.9); }

  .status-text { margin-top: 26px; font-size: 17px; min-height: 24px; }

  .end-btn {
    margin-top: 18px; padding: 9px 22px; border-radius: 20px; cursor: pointer;
    background: transparent; border: 1px solid #f87171; color: #f87171; font-size: 13px;
    transition: all .2s ease;
  }
  .end-btn:hover { background: rgba(248,113,113,.12); }

  .panel {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px;
    padding: 20px; width: 300px;
  }
  .panel h2 { font-size: 13px; letter-spacing: .08em; color: var(--text-dim); margin: 0 0 14px; }
  .state-card {
    display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px;
    margin-bottom: 8px; border: 1px solid transparent; opacity: .45; transition: all .3s ease;
  }
  .state-card .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }
  .state-card b { display: block; font-size: 14px; }
  .state-card span { font-size: 12px; color: var(--text-dim); }
  .state-card.active {
    opacity: 1; border-color: var(--blue); background: rgba(56,189,248,.08);
  }
  .state-card.active .dot { background: var(--blue); box-shadow: 0 0 8px var(--blue); }

  footer { text-align: center; padding: 14px; color: var(--text-dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"></div>
    <div>
      <h1>HomeBot</h1>
      <p>עוזר קולי ביתי</p>
    </div>
  </div>
  <nav>
    <a href="/" class="active">בית</a>
    <a href="/enroll">משתמש חדש</a>
  </nav>
</header>

<main>
  <div class="orb-zone">
    <div class="greeting">שלום 👋</div>
    <div class="subtext">מחא כף פעמיים, או לחץ על הכדור, כדי להתחיל</div>
    <div class="orb-wrap">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="orb" id="orb"></div>
    </div>
    <div class="status-text" id="statusText">מאזין למחיאת כף...</div>
    <button id="endBtn" class="end-btn" style="display:none">סיים שיחה</button>
    <audio id="realtimeAudio" autoplay style="display:none"></audio>
  </div>

  <div class="panel">
    <h2>סטטוס מערכת</h2>
    <div id="stateList"></div>
  </div>
</main>

<footer>HomeBot — capture-svc</footer>

<script>
const STATES = [
  ["listening", "מאזין", "ממתין למחיאת כף כפולה"],
  ["clap", "מחיאה זוהתה", "מפעיל זיהוי"],
  ["identifying", "מזהה", "בודק מי זה מול המצלמה"],
  ["greeting", "מברך", "אומר שלום"],
  ["session", "בשיחה", "מקשיב לך"],
  ["heard", "שמע אותך", ""],
  ["thinking", "חושב", "ממתין לתשובה"],
  ["speaking", "עונה", "מנגן תשובה"],
];

const stateList = document.getElementById("stateList");
const cards = {};
for (const [key, title, sub] of STATES) {
  const el = document.createElement("div");
  el.className = "state-card";
  el.id = "card-" + key;
  el.innerHTML = `<div class="dot"></div><div><b>${title}</b><span>${sub}</span></div>`;
  stateList.appendChild(el);
  cards[key] = el;
}

const orb = document.getElementById("orb");
const statusText = document.getElementById("statusText");

const TEXT_TEMPLATES = {
  listening: "מאזין למחיאת כף...",
  clap: "מחיאה זוהתה!",
  identifying: "מזהה מי זה...",
  greeting: "אומר שלום...",
  session: "בשיחה — מקשיב",
  heard: "שמעתי: {text}",
  thinking: "חושב...",
  speaking: "עונה...",
  realtime_start: "מתחבר לשיחה חיה...",
  realtime: "בשיחה חיה (Realtime)",
  error: "שגיאה — ראה לוג",
};

const endBtn = document.getElementById("endBtn");
// visible any time we're mid-flow — from the clap through to the live
// conversation — hidden while just idly listening for the next trigger
const IN_FLOW_STATES = new Set([
  "clap", "identifying", "greeting", "session", "heard", "thinking", "speaking",
  "realtime_start", "realtime",
]);

function applyState(state, text) {
  orb.className = "orb state-" + state;
  const tpl = TEXT_TEMPLATES[state] || state;
  statusText.textContent = text ? tpl.replace("{text}", text) : tpl;
  for (const key in cards) cards[key].classList.toggle("active", key === state);
  endBtn.style.display = IN_FLOW_STATES.has(state) ? "inline-block" : "none";
}

// ------------------------------------------------------------- realtime
// OpenAI Realtime over WebRTC: audio flows browser<->OpenAI directly
// (this page IS the mic/speaker for that leg) — capture-svc only tells
// us to start (with who + how confidently they were identified) and
// otherwise stays out of the way. See orchestrator/realtime.py for the
// SDP-brokering + tool-call endpoints this talks to.
const ORCHESTRATOR_URL = "http://127.0.0.1:8004"; // matches run-windows.ps1's ORCHESTRATOR_URL
const realtimeAudio = document.getElementById("realtimeAudio");
let realtimePC = null;
let realtimeDC = null;
let realtimeLocalTrack = null;
let realtimeUserId = null;
let realtimeCertain = false;
let voiceIdAudioCtx = null;
let voiceIdChunks = [];
let voiceIdSent = false;
let endingConversation = false;
let audioPlaying = false;
let silenceTimer = null;
const SILENCE_TIMEOUT_MS = 20000; // no new speech this long after a reply -> end on its own

function resetSilenceTimer() {
  if (silenceTimer) clearTimeout(silenceTimer);
  if (!realtimePC) return;
  silenceTimer = setTimeout(() => {
    console.log("[realtime] ending session — silence timeout");
    stopRealtimeSession();
    applyState("listening", "");
  }, SILENCE_TIMEOUT_MS);
}

async function startRealtimeSession(userId, certain) {
  if (realtimePC) return; // already in one
  realtimeUserId = userId || null;
  realtimeCertain = !!certain;
  voiceIdChunks = [];
  voiceIdSent = false;
  endingConversation = false;

  try {
    // explicit AEC/noise/gain constraints — a laptop's mic picking up its
    // own speaker mid-reply (the model hears "itself" and barges in on
    // its own answer) is exactly what echoCancellation is for; leaving
    // this to browser defaults isn't reliable enough to count on
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    const pc = new RTCPeerConnection();
    realtimePC = pc;
    realtimeLocalTrack = stream.getAudioTracks()[0];
    stream.getAudioTracks().forEach((track) => pc.addTrack(track, stream));
    pc.ontrack = (ev) => { realtimeAudio.srcObject = ev.streams[0]; };

    // The face check at trigger time (capture-svc) may not have been
    // certain — voice is the fallback, same idea as the Claude path's
    // mid-conversation confirm, just done client-side since realtime
    // audio never reaches our backend otherwise. Tap the same mic stream
    // with Web Audio to grab a raw PCM sample of the first thing they say.
    if (!realtimeCertain) startVoiceIdCapture(stream);

    const dc = pc.createDataChannel("oai-events");
    realtimeDC = dc;
    dc.addEventListener("message", (ev) => handleRealtimeEvent(JSON.parse(ev.data)));
    // instructions (see orchestrator/realtime.py) tell the model to open
    // with a greeting, but it won't speak until prompted — this is that
    // prompt, replacing the old separate TTS-based greeting call
    dc.addEventListener("open", () => {
      dc.send(JSON.stringify({ type: "response.create" }));
    });

    pc.addEventListener("connectionstatechange", () => {
      if (["disconnected", "failed", "closed"].includes(pc.connectionState) && realtimePC === pc) {
        stopRealtimeSession();
        applyState("listening", "");
      }
    });

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitForIceGathering(pc);

    const qs = `user_id=${encodeURIComponent(userId || "")}&certain=${certain ? "true" : "false"}`;
    const resp = await fetch(`${ORCHESTRATOR_URL}/realtime/session?${qs}`, {
      method: "POST",
      headers: { "Content-Type": "application/sdp" },
      body: pc.localDescription.sdp,
    });
    if (!resp.ok) throw new Error(`session create failed: ${resp.status}`);
    const answerSdp = await resp.text();
    await pc.setRemoteDescription({ type: "answer", sdp: answerSdp });

    applyState("realtime", "");
  } catch (e) {
    console.error("realtime session failed to start", e);
    applyState("error", "realtime: " + e.message);
    stopRealtimeSession();
  }
}

function waitForIceGathering(pc) {
  if (pc.iceGatheringState === "complete") return Promise.resolve();
  return new Promise((resolve) => {
    function check() {
      if (pc.iceGatheringState === "complete") {
        pc.removeEventListener("icegatheringstatechange", check);
        resolve();
      }
    }
    pc.addEventListener("icegatheringstatechange", check);
  });
}

function startVoiceIdCapture(stream) {
  const AC = window.AudioContext || window.webkitAudioContext;
  voiceIdAudioCtx = new AC();
  const source = voiceIdAudioCtx.createMediaStreamSource(stream);
  // ScriptProcessorNode is deprecated in favor of AudioWorklet, but needs
  // no separate module file to load and is plenty for "grab some PCM
  // once" — not worth the extra moving part here.
  const processor = voiceIdAudioCtx.createScriptProcessor(4096, 1, 1);
  processor.onaudioprocess = (ev) => {
    if (voiceIdSent) return;
    voiceIdChunks.push(new Float32Array(ev.inputBuffer.getChannelData(0)));
    // cap at ~6s so this can't grow unbounded if speech_stopped never fires
    const totalSamples = voiceIdChunks.reduce((n, c) => n + c.length, 0);
    if (totalSamples > voiceIdAudioCtx.sampleRate * 6) voiceIdChunks.shift();
  };
  source.connect(processor);
  processor.connect(voiceIdAudioCtx.destination);
  voiceIdAudioCtx._processorNode = processor; // keep a reference for cleanup
}

function stopVoiceIdCapture() {
  if (voiceIdAudioCtx) {
    voiceIdAudioCtx.close().catch(() => {});
    voiceIdAudioCtx = null;
  }
  voiceIdChunks = [];
}

async function sendVoiceIdCapture() {
  if (!voiceIdAudioCtx || voiceIdChunks.length === 0) return;
  voiceIdSent = true;
  const sampleRate = voiceIdAudioCtx.sampleRate;

  const totalLen = voiceIdChunks.reduce((n, c) => n + c.length, 0);
  const merged = new Float32Array(totalLen);
  let offset = 0;
  for (const chunk of voiceIdChunks) { merged.set(chunk, offset); offset += chunk.length; }

  const pcm16 = new Int16Array(merged.length);
  for (let i = 0; i < merged.length; i++) {
    const s = Math.max(-1, Math.min(1, merged[i]));
    pcm16[i] = s < 0 ? s * 32768 : s * 32767;
  }
  let binary = "";
  const bytes = new Uint8Array(pcm16.buffer);
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  const audioB64 = btoa(binary);

  try {
    const resp = await fetch(`${ORCHESTRATOR_URL}/realtime/identify-voice`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ audio_b64: audioB64, sample_rate: sampleRate }),
    });
    const result = await resp.json();
    if (result.certain) applyIdentityUpdate(result);
  } catch (e) {
    console.warn("[realtime] voice-id capture failed", e);
  } finally {
    stopVoiceIdCapture(); // one attempt per session — done either way
  }
}

function applyIdentityUpdate(result) {
  realtimeUserId = result.user_id;
  realtimeCertain = true;
  console.log("[realtime] identity confirmed by voice:", result.user_id);
  if (realtimeDC && realtimeDC.readyState === "open") {
    realtimeDC.send(JSON.stringify({
      type: "session.update",
      session: { type: "realtime", instructions: result.instructions },
    }));
  }
}

async function handleRealtimeEvent(event) {
  // logged for every event type — this is the only place a cut-short
  // reply is visible at all, since realtime audio never touches our own
  // servers/logs (browser<->OpenAI directly). Open devtools (F12) ->
  // Console before reproducing a cutoff and look for
  // response.done/response.cancelled/error here.
  console.log("[realtime]", event.type, event);

  switch (event.type) {
    // echoCancellation + a higher VAD threshold (orchestrator/realtime.py)
    // weren't enough on their own — the mic still occasionally picked up
    // the assistant's own voice through the speaker, server_vad read that
    // as the user talking, and cancelled the response mid-sentence, which
    // triggered a new response, which got interrupted the same way, on
    // and on. Muting the local track for the exact duration the assistant
    // is actually outputting audio makes that physically impossible —
    // the cost is you can't barge in mid-reply, only speak after it ends.
    case "output_audio_buffer.started":
      audioPlaying = true;
      if (realtimeLocalTrack) realtimeLocalTrack.enabled = false;
      break;
    case "output_audio_buffer.stopped":
    case "output_audio_buffer.cleared":
      audioPlaying = false;
      if (realtimeLocalTrack) realtimeLocalTrack.enabled = true;
      if (endingConversation) {
        stopRealtimeSession();
        applyState("listening", "");
      } else {
        resetSilenceTimer();
      }
      break;
    case "input_audio_buffer.speech_started":
      applyState("heard", "");
      resetSilenceTimer();
      break;
    case "input_audio_buffer.speech_stopped":
      applyState("thinking", "");
      if (!realtimeCertain && !voiceIdSent) sendVoiceIdCapture();
      break;
    case "response.function_call_arguments.done":
      if (event.name === "end_conversation") {
        // client-side-only tool (see orchestrator/realtime.py) — ack it
        // so the model doesn't error. The tool call often arrives in a
        // response with no audio of its own (the farewell line already
        // finished playing in an earlier response) — in that case there's
        // no future output_audio_buffer.stopped to hang the close on, so
        // waiting for one meant sitting idle until the 20s silence
        // timeout instead of closing right away. Only defer the close if
        // audio is still actively playing (farewell + tool call landed in
        // the same response); otherwise end immediately.
        realtimeDC.send(JSON.stringify({
          type: "conversation.item.create",
          item: { type: "function_call_output", call_id: event.call_id, output: '{"ok":true}' },
        }));
        if (audioPlaying) {
          endingConversation = true;
        } else {
          stopRealtimeSession();
          applyState("listening", "");
        }
      } else {
        await runRealtimeToolCall(event);
      }
      break;
    case "response.done":
      // status is "completed" normally; "cancelled"/"incomplete"/
      // "failed" here is the model getting cut off — event.response
      // carries the reason (status_details)
      if (event.response && event.response.status !== "completed") {
        console.warn("[realtime] response ended abnormally:", event.response.status, event.response.status_details);
      }
      applyState("realtime", "");
      break;
    case "response.cancelled":
      console.warn("[realtime] response cancelled", event);
      applyState("realtime", "");
      break;
    case "error":
      console.error("[realtime] error event", event);
      applyState("error", event.error?.message || "realtime error");
      break;
  }
}

async function runRealtimeToolCall(event) {
  applyState("thinking", event.name);
  let result;
  try {
    const resp = await fetch(`${ORCHESTRATOR_URL}/realtime/tool-call`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: event.name,
        arguments: JSON.parse(event.arguments || "{}"),
        user_id: realtimeUserId,
      }),
    });
    result = await resp.json();
  } catch (e) {
    result = { ok: false, error: String(e) };
  }
  realtimeDC.send(JSON.stringify({
    type: "conversation.item.create",
    item: { type: "function_call_output", call_id: event.call_id, output: JSON.stringify(result) },
  }));
  realtimeDC.send(JSON.stringify({ type: "response.create" }));
}

function stopRealtimeSession() {
  if (realtimePC) {
    realtimePC.getSenders().forEach((s) => s.track && s.track.stop());
    realtimePC.close();
    // capture-svc's clap detector was still running the whole time this
    // realtime session was open (it has no other way to know the browser
    // is mid-conversation) — short loud bursts in normal speech were
    // passing the clap duration gate and firing a brand new session on
    // top of this one every 15-20s. Tell it explicitly so main_loop can
    // wait for this before re-arming instead of racing it.
    fetch("/api/end-session", { method: "POST" }).catch(() => {});
  }
  stopVoiceIdCapture();
  if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
  endingConversation = false;
  realtimePC = null;
  realtimeDC = null;
  realtimeLocalTrack = null;
  realtimeUserId = null;
  realtimeCertain = false;
}

endBtn.addEventListener("click", () => {
  if (realtimePC) {
    stopRealtimeSession();
    applyState("listening", "");
  } else {
    fetch("/api/end-session", { method: "POST" }).catch(() => {});
  }
});

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws/status`);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    applyState(msg.state, msg.text);
    if (msg.state === "realtime_start") {
      startRealtimeSession(msg.user_id, msg.certain);
    }
  };
  ws.onclose = () => setTimeout(connect, 1500);
}
connect();

orb.addEventListener("click", async () => {
  try {
    await fetch("/api/trigger", { method: "POST" });
  } catch (e) {
    // status panel will still reflect whatever main.py ends up doing
  }
});
</script>
</body>
</html>
