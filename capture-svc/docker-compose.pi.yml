# Runs ONLY capture-svc, on the Raspberry Pi. Every other service
# (orchestrator, vision-id-svc, voice-id-svc, tany-bridge, profile-store)
# stays on the PC's own docker-compose.yml — this file intentionally does
# not duplicate them. See README-pi.md for the full setup.
#
# network_mode: host (not port publishing) — simplest way to let the
# container see the Pi's paired Bluetooth ALSA device and to serve the
# dashboard on the Pi's real LAN IP without a separate mapping step.
# Safe here because nothing else runs on this Pi.
services:
  capture-svc:
    build: .
    container_name: homebot-capture
    network_mode: host
    devices:
      - /dev/snd:/dev/snd
      # - /dev/gpiomem:/dev/gpiomem   # uncomment for step 3 (physical button)
    volumes:
      # BlueALSA is a userspace daemon talking over D-Bus, not a plain
      # ALSA device node — /dev/snd alone isn't enough for the
      # container's ALSA "bluealsa" plugin to reach it. Also needs the
      # host's ~/.asoundrc (default PCM routed through bluealsa) since
      # a container has no home directory of its own to find one in.
      - /var/run/dbus:/var/run/dbus
      - ${HOME}/.asoundrc:/root/.asoundrc:ro
    environment:
      - RTSP_URL=${RTSP_URL}
      - VISION_SVC_URL=${VISION_SVC_URL}
      - VOICE_SVC_URL=${VOICE_SVC_URL}
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL}
      - WEB_UI_PORT=${WEB_UI_PORT:-8010}
      - CLAP_ENERGY_THRESHOLD=${CLAP_ENERGY_THRESHOLD:-0.08}
      - CLAP_WINDOW_MS=${CLAP_WINDOW_MS:-900}
      - CLAP_REFRACTORY_MS=${CLAP_REFRACTORY_MS:-100}
      - CLAP_MAX_MS=${CLAP_MAX_MS:-60}
      - USE_REALTIME=0
      # PortAudio's own "default" device resolution doesn't reliably
      # follow ~/.asoundrc's pcm.!default (confirmed live: it picked a
      # raw hw:X,Y ALSA loopback device instead) — name the real
      # devices explicitly instead of fighting that. Match the pcm
      # names actually defined in ~/.asoundrc.
      - MIC_DEVICE_NAME=${MIC_DEVICE_NAME:-m5mic_plug}
      - SPEAKER_DEVICE_NAME=${SPEAKER_DEVICE_NAME:-jbl_a2dp}
      - SPEAKER_SAMPLE_RATE=${SPEAKER_SAMPLE_RATE:-48000}
      # - BUTTON_GPIO_PIN=17          # uncomment for step 3
    restart: unless-stopped
